name: Server
on:
  workflow_dispatch:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build admin web
        working-directory: server/cmd/telesrv-admin/web
        run: npm ci && npm run build
      - name: Build DeltaMent web
        working-directory: server/cmd/deltament/web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build Go
        working-directory: server
        run: go build ./...
