name: Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/build.gradle', 'android/gradle.properties') }}
      - name: Create CI debug keystore
        working-directory: android
        run: |
          keytool -genkeypair -keystore TMessagesProj/config/release.keystore             -alias androidkey -storepass android -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=DeltaGram CI, OU=Dev, O=DeltaGram, L=Kyiv, C=UA"
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaGram-debug
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
