name: Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

env:
  # ccache is shared between runs, so unchanged C/C++ translation units are
  # not recompiled by the NDK at all.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Caches Gradle User Home (dependencies + local build cache) and
          # configures the Gradle build cache for this run.
          cache-read-only: false
          gradle-home-cache-cleanup: true
      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --version | head -n 1
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('android/TMessagesProj/jni/**', 'android/TMessagesProj/build.gradle') }}
          restore-keys: |
            ccache-${{ runner.os }}-
      - name: Create CI debug keystore
        working-directory: android
        run: |
          keytool -genkeypair -keystore TMessagesProj/config/release.keystore             -alias androidkey -storepass android -keypass android             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=DeltaGram CI, OU=Dev, O=DeltaGram, L=Kyiv, C=UA"
      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon \
            -PdgAbis=arm64-v8a \
            -PdgCcache \
            -Dorg.gradle.workers.max=4
      - name: ccache stats
        run: ccache --show-stats || true
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaGram-debug
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
