  const withdraw=()=>modal('Вывод в Stars','Введи TON. Выплата будет выполнена в Stars по курсу 1 TON = 100 Stars.','<input name="amount" type="number" min="0.01" step="0.01" placeholder="Количество TON" required><div class="dm-conversion">Получите: <b data-converted>0 Stars</b></div>','Вывести',async(f,s)=>{const nano=tonNano(f.amount.value);s.textContent='Оформляем выплату…';const result=await api('/api/me/withdraw',{method:'POST',body:JSON.stringify({amount:nano,request_id:crypto.randomUUID()})});s.textContent='Зачислено '+Number(result.stars||0)+' Stars.'});
  const replace=()=>{document.querySelectorAll('[data-dm-topup]').forEach(old=>{if(old.dataset.dmAuthoritative)return;const b=old.cloneNode(true);b.removeAttribute('data-dm-topup');b.dataset.dmAuthoritative='1';b.addEventListener('click',e=>{e.preventDefault();topup()});old.replaceWith(b)});document.querySelectorAll('.dm-control-panel').forEach(panel=>{if(panel.querySelector('[data-dm-withdraw]'))return;const b=document.createElement('button');b.className='dm-action secondary';b.type='button';b.dataset.dmWithdraw='1';b.textContent='Вывести в Stars';b.onclick=withdraw;const top=panel.querySelector('[data-dm-authoritative]');(top?.parentElement||panel).appendChild(b)})};
  const bindConversion=()=>document.querySelectorAll('.dm-authoritative-topup input[name=amount]').forEach(i=>{if(i.dataset.bound)return;i.dataset.bound='1';const out=i.parentElement.querySelector('[data-converted]')||i.closest('form').querySelector('[data-converted]');i.oninput=()=>{const n=Number(i.value)||0;if(out)out.textContent=i.closest('form').querySelector('[data-converted]')?.textContent.includes('TON')?((n/100).toFixed(2).replace(/\.00$/,'')+' TON'):(n*100).toLocaleString('ru-RU')+' Stars'};});
  document.addEventListener('click',e=>{const bid=e.target.closest?.('[data-dm-bid]');if(!bid)return;setTimeout(()=>{window.dispatchEvent(new CustomEvent('dm:bid-updated'));replace()},500)},{capture:false});
  document.addEventListener('DOMContentLoaded',()=>{replace();setInterval(()=>{replace();bindConversion()},400)});
})();
</script>
<style>.dm-conversion{margin-top:10px;color:#a9efff;font-size:13px}@media(max-width:640px){.dm-topup-card{max-height:calc(100dvh - 24px);overflow:auto}.dm-topup-actions{gap:10px}.dm-topup-actions .dm-action{flex:1}}</style>
</html>
